name: Multi-Forex Automated Quant Cycle

on:
  schedule:
    # Runs every 15 minutes Monday through Friday
    - cron: '*/15 * * * 1-5'
  workflow_dispatch:

jobs:
  run-quant-engine:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Multi-Forex Exness MT5 Trading Cycle
        env:
          PYTHONIOENCODING: "utf-8"
          EXNESS_MT5_LOGIN: ${{ secrets.EXNESS_MT5_LOGIN }}
          EXNESS_MT5_PASSWORD: ${{ secrets.EXNESS_MT5_PASSWORD }}
          EXNESS_MT5_SERVER: ${{ secrets.EXNESS_MT5_SERVER }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: |
          python multi_forex_quant_bot.py
