name: Multi-Forex Automated Quant Cycle

on:
  schedule:
    # Runs every 15 minutes Monday through Friday (Active Forex Hours)
    - cron: '*/15 * * * 1-5'
  workflow_dispatch:

jobs:
  run-quant-engine:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download & Install Exness MT5 Terminal
        shell: powershell
        run: |
          Write-Host "Downloading Exness MT5 Setup..."
          $url = "https://download.mql5.com/cdn/web/exness.technologies.ltd/mt5/exness5setup.exe"
          Invoke-WebRequest -Uri $url -OutFile "exness5setup.exe"
          
          Write-Host "Installing MetaTrader 5 silently..."
          Start-Process -FilePath ".\exness5setup.exe" -ArgumentList "/auto" -Wait
          
          Write-Host "Verifying MetaTrader 5 installation..."
          Start-Sleep -Seconds 10

      - name: Launch MT5 Background Process & Execute Quant Engine
        shell: powershell
        env:
          PYTHONIOENCODING: "utf-8"
          EXNESS_MT5_LOGIN: ${{ secrets.EXNESS_MT5_LOGIN }}
          EXNESS_MT5_PASSWORD: ${{ secrets.EXNESS_MT5_PASSWORD }}
          EXNESS_MT5_SERVER: ${{ secrets.EXNESS_MT5_SERVER }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: |
          # Locate installed terminal64.exe
          $mt5Path = "C:\Program Files\MetaTrader 5\terminal64.exe"
          if (-not (Test-Path $mt5Path)) {
              $mt5Path = Get-ChildItem -Path "C:\Program Files" -Filter "terminal64.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName -First 1
          }
          
          if ($mt5Path) {
              Write-Host "Launching MT5 Terminal from: $mt5Path"
              Start-Process -FilePath $mt5Path -ArgumentList "/portable"
              Start-Sleep -Seconds 15
          } else {
              Write-Host "Warning: terminal64.exe binary path not found. Proceeding with standard IPC initialization."
          }
          
          # Execute Quantitative Engine Cycle
          python multi_forex_quant_bot.py
