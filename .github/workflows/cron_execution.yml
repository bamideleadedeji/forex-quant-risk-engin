name: Multi-Forex Automated Quant Cycle

on:
  schedule:
    # Runs every 15 minutes Monday through Friday (Active Forex Hours)
    - cron: '*/15 * * * 1-5'
  workflow_dispatch:

jobs:
  run-quant-engine:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Multi-Forex Trading Cycle
        env:
          OANDA_ACCOUNT_ID: ${{ secrets.OANDA_ACCOUNT_ID }}
          OANDA_ACCESS_TOKEN: ${{ secrets.OANDA_ACCESS_TOKEN }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: |
          python multi_forex_quant_bot.py
